server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /apresentacao {
        rewrite ^ /apresentacao_comercial_sum_connect.html break;
    }

    location = /biblioteca-de-automacoes {
        rewrite ^ /apresentacao_n8n_leads.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}

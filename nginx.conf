server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /api/lead {
        proxy_pass https://n8n.sumconnectia.com/webhook/novoLead;
        proxy_http_version 1.1;

        proxy_set_header Host n8n.sumconnectia.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
        proxy_set_header Accept application/json;
        proxy_set_header X-Requested-With XMLHttpRequest;
    }

    location /apresentacao {
        rewrite ^/apresentacao/?$ /apresentacao_comercial_sum_connect.html break;
    }

    location /biblioteca-de-automacoes {
        rewrite ^/biblioteca-de-automacoes/?$ /apresentacao_n8n_leads.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}